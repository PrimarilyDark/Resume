<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualizer — Dave Persaud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='12' width='4' height='8' rx='2' fill='%23ff7a3c'/%3E%3Crect x='10' y='6' width='4' height='20' rx='2' fill='%23ffb04d'/%3E%3Crect x='16' y='10' width='4' height='12' rx='2' fill='%23ff4d2e'/%3E%3Crect x='22' y='4' width='4' height='24' rx='2' fill='%23ffb04d'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Dave Persaud — Immersive Audio Visualizer (ground-up rebuild)
   Full-viewport stage, cinematic dark-first, ember/amber/coral palette.
   ========================================================================== */
:root {
    --bg: #0a0705;
    --ink: #f7efe6;
    --muted: #b3a490;
    --glass: rgba(26, 18, 12, 0.55);
    --glass-strong: rgba(30, 21, 14, 0.78);
    --glass-brd: rgba(255, 178, 120, 0.16);
    --glass-brd-hi: rgba(255, 178, 120, 0.38);
    --accent: #ff7a3c;          /* coral */
    --accent2: #ffb04d;         /* amber */
    --ember: #ff4d2e;           /* ember  */
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
}
[data-theme="light"] {
    --bg: #f4ede2;
    --ink: #2a1f16;
    --muted: #7a6a58;
    --glass: rgba(255, 250, 242, 0.6);
    --glass-strong: rgba(255, 250, 242, 0.85);
    --glass-brd: rgba(160, 90, 30, 0.2);
    --glass-brd-hi: rgba(160, 90, 30, 0.45);
    --shadow: 0 18px 50px rgba(90, 50, 20, 0.22);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
}

/* ---------- Stage ---------- */
#stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(120% 90% at 50% 110%, rgba(255, 90, 40, 0.10), transparent 55%),
        radial-gradient(80% 60% at 50% -10%, rgba(255, 176, 77, 0.07), transparent 60%),
        var(--bg);
    transition: background 0.4s ease;
}
body.theater #stage { position: fixed; inset: 0; z-index: 9500; }

#viz {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(115% 100% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.42) 100%);
}
[data-theme="light"] #vignette {
    background: radial-gradient(115% 100% at 50% 50%, transparent 60%, rgba(120, 70, 25, 0.16) 100%);
}

/* ---------- Floating chrome (shared glass style) ---------- */
.glass {
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    border: 1px solid var(--glass-brd);
    box-shadow: var(--shadow);
}

/* ---------- Entrance animation ---------- */
#chip, #menuBtn, #menuPanel, #controls {
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s ease, border-color 0.25s ease;
}
body.ready #chip, body.ready #menuBtn, body.ready #controls { opacity: 1; }
body.ready #menuBtn { transform: translateY(0); }
#menuBtn { transform: translateY(-8px); }
#controls { transform: translate(-50%, 14px); }
body.ready #controls { transform: translate(-50%, 0); }

/* ---------- Title chip (top-center) ---------- */
#chip {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    translate: -50% 0;
    max-width: min(72vw, 560px);
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 60;
    text-align: center;
}
#chip .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: 1px;
    box-shadow: 0 0 8px var(--accent);
}

/* ---------- Corner menu (top-left) ---------- */
#menuBtn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    width: 44px; height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink);
    z-index: 70;
    padding: 0;
}
#menuBtn:hover { border-color: var(--glass-brd-hi); background: var(--glass-strong); }
#menuBtn svg { width: 20px; height: 20px; }

#menuPanel {
    position: absolute;
    top: calc(max(14px, env(safe-area-inset-top)) + 52px);
    left: max(14px, env(safe-area-inset-left));
    width: 228px;
    border-radius: 18px;
    padding: 14px;
    z-index: 70;
    transform-origin: top left;
    transform: scale(0.92);
    pointer-events: none;
}
#menuPanel.open { opacity: 1; transform: scale(1); pointer-events: auto; }
#menuPanel h2 {
    margin: 0 0 8px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 700;
}
#menuPanel nav { display: flex; flex-direction: column; gap: 2px; }
#menuPanel nav a {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 7px 10px;
    border-radius: 10px;
    transition: background 0.18s ease, color 0.18s ease, padding-left 0.18s ease;
}
#menuPanel nav a:hover { background: rgba(255, 122, 60, 0.14); color: var(--accent2); padding-left: 14px; }
#menuPanel .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--glass-brd);
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
}
#themeToggle, #fontSelect {
    background: rgba(255, 122, 60, 0.1);
    color: var(--ink);
    border: 1px solid var(--glass-brd);
    border-radius: 9px;
    padding: 5px 10px;
    font-size: 0.78rem;
    font-family: var(--font);
    cursor: pointer;
}
#fontSelect { max-width: 128px; }

/* ---------- Control pill (bottom-center, auto-hides) ---------- */
#controls {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    z-index: 60;
    max-width: calc(100vw - 24px);
    flex-wrap: nowrap;
}
body.ui-hidden #controls, body.ui-hidden #chip {
    opacity: 0 !important;
    pointer-events: none;
}
body.ui-hidden #controls { transform: translate(-50%, 20px) !important; }
body.ui-hidden { cursor: none; }

.ctl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 38px;
    min-width: 38px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-family: var(--font);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
    white-space: nowrap;
}
.ctl:hover { background: rgba(255, 122, 60, 0.16); border-color: var(--glass-brd-hi); }
.ctl:active { transform: scale(0.94); }
.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl.active { background: rgba(255, 122, 60, 0.24); border-color: var(--accent); color: var(--accent2); }
.ctl svg { width: 17px; height: 17px; flex: none; }
#btnPlay { background: linear-gradient(135deg, var(--accent), var(--ember)); color: #fff; }
#btnPlay:hover { background: linear-gradient(135deg, var(--accent2), var(--accent)); }

#controls .sep { width: 1px; height: 24px; background: var(--glass-brd); flex: none; }

#vol { width: 74px; accent-color: var(--accent); cursor: pointer; }
#seek { width: clamp(90px, 18vw, 220px); accent-color: var(--accent2); cursor: pointer; }
#time {
    font-size: 0.72rem;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
}

/* ---------- Drag & drop overlay ---------- */
#dropOverlay {
    position: absolute;
    inset: 0;
    z-index: 90;
    display: grid;
    place-items: center;
    background: rgba(8, 5, 3, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}
#dropOverlay.show { opacity: 1; }
#dropOverlay .ring {
    border: 2px dashed var(--accent);
    border-radius: 26px;
    padding: 42px 64px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent2);
    letter-spacing: 0.03em;
    animation: dropPulse 1.4s ease-in-out infinite;
}
@keyframes dropPulse { 50% { transform: scale(1.045); } }

@media (max-width: 720px) {
    .ctl .lbl { display: none; }
    #time { display: none; }
    #seek { width: 26vw; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<div id="stage">

    <button id="menuBtn" class="glass" aria-label="Portfolio menu" aria-expanded="false">

<script>
'use strict';
/* ==========================================================================
   0. Storage shim — localStorage can throw in sandboxed iframes; fall back
      to an in-memory map. Never throws, never logs.
   ========================================================================== */
const store = (() => {
    const mem = new Map();
    const memShim = {
        getItem: k => (mem.has(k) ? mem.get(k) : null),
        setItem: (k, v) => { mem.set(k, String(v)); },
        removeItem: k => { mem.delete(k); }
    };
    try {
        const probe = '__viz_probe__';
        window.localStorage.setItem(probe, '1');
        window.localStorage.removeItem(probe);
        return window.localStorage;
    } catch (e) {
        return memShim;
    }
})();
const save = (k, v) => { try { store.setItem(k, v); } catch (e) { /* memory full etc. — non-fatal */ } };
const load = k => { try { return store.getItem(k); } catch (e) { return null; } };

/* ==========================================================================
   1. DOM refs & global state
   ========================================================================== */
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('viz'), chipText = $('chipText');
const audio = $('audio'), fileInput = $('fileInput');
const btnPlay = $('btnPlay'), btnMode = $('btnMode'), btnMic = $('btnMic'),
      btnDemo = $('btnDemo'), btnFs = $('btnFs'), btnUpload = $('btnUpload');
const icoPlay = $('icoPlay'), icoPause = $('icoPause'), modeName = $('modeName');
const volSlider = $('vol'), seekSlider = $('seek'), timeLabel = $('time');

const ctx2d = canvas.getContext('2d');
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const MODES = ['Circular', 'Bars', 'Wave', 'Orbit', 'Nebula', 'Spiral'];
let modeIndex = 0;
let activeSource = 'none';      // 'none' | 'file' | 'demo' | 'mic'
let objectUrl = null;
let trackTitle = 'No track loaded';

/* ==========================================================================
   2. Audio graph
      elementSource ─┬─> analyser                 (visuals, volume-independent)
                     └─> masterGain ─> destination (audible, volume-controlled)
      demoBus ───────┬─> analyser
                     └─> masterGain ─> destination
      micSource ─────┴─> analyser only            (never audible — no feedback)
   ========================================================================== */
let actx = null, analyser = null, masterGain = null, elementSource = null, micNode = null;
let micStream = null;
let freqData = null, timeData = null, prevTimeData = null, floatTime = null;

function ensureAudio() {
    if (actx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
        actx = new AC();
        analyser = actx.createAnalyser();
        analyser.fftSize = 4096;                 // 2048 real bins -> ~10.7 Hz/bin @44.1k
        analyser.smoothingTimeConstant = 0.75;
        analyser.minDecibels = -85;
        analyser.maxDecibels = -25;
        masterGain = actx.createGain();
        masterGain.gain.value = Math.pow(volSlider.value / 100, 1.5);
        masterGain.connect(actx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);
        prevTimeData = new Uint8Array(analyser.fftSize);
        floatTime = new Float32Array(analyser.fftSize);
        buildBands();
        return true;
    } catch (e) {
        actx = null;
        return false;
    }
}
function resumeAudio() {
    if (actx && actx.state === 'suspended') {
        actx.resume().catch(() => { /* autoplay policy — will retry on next gesture */ });
    }
}

/* ==========================================================================
   3. DSP — full-range log-scale bands, CONSTRAINED adaptive auto-gain (slow
      floor + slow peak, ~30 dB window, blended 50/50 with compressed raw so
      absolute dynamics — e.g. a vocal phrase entering/leaving — stay visible),
      vocal-presence emphasis (~700 Hz–4 kHz), perceptual treble boost,
      per-band attack/release envelopes, adaptive beat detection.
   ========================================================================== */
const BAND_COUNT = 96;
const F_MIN = 30, F_MAX = 16000;
const bands = [];            // { b0, b1, freq }
const bandPeak  = new Float32Array(BAND_COUNT);  // slow-adapting running peak (auto-gain window top)
const bandFloor = new Float32Array(BAND_COUNT);  // slow-adapting running floor (auto-gain window bottom)
const bandEnv   = new Float32Array(BAND_COUNT);  // attack/release envelope (what we render)
const bandBoost = new Float32Array(BAND_COUNT);  // perceptual treble + vocal-presence boost factor
const barsCap   = new Float32Array(BAND_COUNT);  // falling peak caps for Bars mode
let level = 0, bassLevel = 0, midLevel = 0, trebleLevel = 0;

/* Analyser maps -85..-25 dB onto 0..255 -> ~4.25 byte units per dB */
const DB_PER_UNIT = 4.25 / 255;
const AGC_WINDOW = 30 * DB_PER_UNIT;   // adaptive window capped at ~30 dB (in 0..1 units)
const AGC_BLEND = 0.5;                 // 50/50: windowed norm vs compressed raw level

function buildBands() {
    bands.length = 0;
    const sr = actx.sampleRate;
    const binHz = (sr / 2) / analyser.frequencyBinCount;
    const ratio = F_MAX / F_MIN;
    for (let i = 0; i < BAND_COUNT; i++) {
        const f0 = F_MIN * Math.pow(ratio, i / BAND_COUNT);
        const f1 = F_MIN * Math.pow(ratio, (i + 1) / BAND_COUNT);
        let b0 = Math.floor(f0 / binHz);
        let b1 = Math.ceil(f1 / binHz);
        b0 = Math.max(1, b0);
        b1 = Math.min(analyser.frequencyBinCount, Math.max(b0 + 1, b1));
        const freq = Math.sqrt(f0 * f1);
        bands.push({ b0, b1, freq });
        // +4 dB/octave perceptual boost above 2 kHz (byte scale: 255 ≈ 60 dB -> ~4.25/dB)
        let boost = freq > 2000 ? 1 + Math.log2(freq / 2000) * 4 * DB_PER_UNIT : 1;
        // vocal-presence emphasis: smooth +4 dB bump across 700 Hz–4 kHz,
        // peaking near 2.7 kHz (raised cosine in log-frequency). Bass untouched.
        if (freq > 700 && freq < 4000) {
            const t = (Math.log(freq / 700)) / Math.log(4000 / 700);
            boost *= 1 + 4.0 * Math.sin(Math.PI * t) * Math.sin(Math.PI * t) * DB_PER_UNIT;
        }
        bandBoost[i] = boost;
        bandPeak[i] = 0.08;
        bandFloor[i] = 0;
        bandEnv[i] = 0;
    }
    BASS_BANDS = Math.max(2, bands.filter(b => b.freq < 150).length);
}

/* Beat detection on 30–150 Hz energy, adaptive rolling threshold + refractory */
let BASS_BANDS = 6;   // recomputed in buildBands() to cover 30–150 Hz
const bassHist = [];
let lastBeatAt = 0, beatPulse = 0, beatCount = 0;

function analyse(now) {
    if (!analyser || activeSource === 'none') return;
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    let sumAll = 0, sumBass = 0, sumMid = 0, sumTreble = 0, bassRaw = 0, sumVocal = 0;
    for (let i = 0; i < BAND_COUNT; i++) {
        const b = bands[i];
        let acc = 0;
        for (let j = b.b0; j < b.b1; j++) acc += freqData[j];
        const raw = acc / ((b.b1 - b.b0) * 255);
        if (i < BASS_BANDS) bassRaw += raw / BASS_BANDS;        // pre-normalization: keeps transient contrast
        let v = raw * bandBoost[i];                             // perceptual + vocal-presence boost
        /* dynamic vocal emphasis: while singing is detected, temporarily lift
           200 Hz–4 kHz (raised-cosine bump, same shape as the static boost) */
        if (vocalLevel > 0.1 && b.freq > 200 && b.freq < 4000) {
            const vt = Math.log(b.freq / 200) / Math.log(4000 / 200);
            const bump = Math.sin(Math.PI * vt);
            v *= 1 + vocalLevel * 0.35 * bump * bump;
        }
        if (v > 1) v = 1;

        /* constrained adaptive window: slow peak (fast rise, very slow decay)
           + slow floor (fast fall, slow rise), width capped at ~30 dB. A band
           that is genuinely louder than its own history saturates gracefully
           instead of every band being pinned to full scale. */
        if (v > bandPeak[i]) bandPeak[i] = v;
        else bandPeak[i] = Math.max(0.06, bandPeak[i] * 0.9985);
        if (v < bandFloor[i]) bandFloor[i] = v;
        else bandFloor[i] += (v - bandFloor[i]) * 0.002;        // very slow rise toward current level
        if (bandPeak[i] - bandFloor[i] > AGC_WINDOW) {
            bandFloor[i] = bandPeak[i] - AGC_WINDOW;            // cap window width
        }
        const span = bandPeak[i] - bandFloor[i];
        let norm = span > 1e-4 ? (v - bandFloor[i]) / span : 0;
        if (norm > 1) norm = 1; else if (norm < 0) norm = 0;

        /* blend 50/50 with compressed raw level: absolute dynamics (a vocal
           phrase starting/stopping over the bed) stay visible as movement */
        const out = AGC_BLEND * norm + (1 - AGC_BLEND) * Math.pow(v, 0.75);

        /* envelope: fast attack ~0.65, moderate release ~0.15 */
        const k = out > bandEnv[i] ? 0.65 : 0.15;
        bandEnv[i] += (out - bandEnv[i]) * k;

        /* energy envelopes from RAW (pre-normalization) levels — transients
           and section-to-section contrast are preserved, not flattened */
        sumAll += raw;
        if (b.freq >= 300 && b.freq <= 3400) sumVocal += raw;   // vocal-band energy (see 3.5)
        if (i < 14) sumBass += raw;
        else if (i < 64) sumMid += raw;                         // ~150 Hz–2 kHz
        if (i >= BAND_COUNT - 26) sumTreble += raw;
    }
    level = sumAll / BAND_COUNT;
    bassLevel = sumBass / 14;
    midLevel = sumMid / 50;
    trebleLevel = sumTreble / 26;
    vocalRatio = sumAll > 1e-6 ? sumVocal / sumAll : 0;

    /* beat: raw 30–150 Hz energy vs adaptive rolling mean, 150 ms refractory */
    bassHist.push(bassRaw);
    if (bassHist.length > 48) bassHist.shift();
    let mean = 0;
    for (const x of bassHist) mean += x;
    mean /= bassHist.length;
    if (bassRaw > mean * 1.3 + 0.02 && bassRaw > 0.12 && now - lastBeatAt > 150) {
        lastBeatAt = now;
        beatPulse = 1;
        beatCount++;
    }

    detectVocals();
}
/* ==========================================================================
   3.5 Vocal / singing detection — RMS gate, normalized-autocorrelation pitch
       tracking (80 Hz–1.1 kHz sung fundamental), pitch-stability + vocal-band
       energy scoring. Exposes vocalLevel / vocalPitch / vocalPitchNorm /
       vocalNote for the Nebula comet and the global vocal overlay.
   ========================================================================== */
const clamp01 = v => (v < 0 ? 0 : (v > 1 ? 1 : v));
let vocalLevel = 0, vocalPitch = 0, vocalPitchNorm = 0.5, vocalNote = '';
let vocalRatio = 0;              // 300–3400 Hz share of total band energy (set in analyse)
let vocalFrame = 0;              // autocorrelation runs every 2nd frame
const PITCH_HIST = 20;
const pitchHist = new Float32Array(PITCH_HIST);   // ring of recent pitches (0 = invalid)
const pitchScratch = new Float32Array(PITCH_HIST);
let pitchHistIdx = 0, pitchValidCount = 0;
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function pushPitch(f) {
    if (pitchHist[pitchHistIdx] > 0) pitchValidCount--;
    pitchHist[pitchHistIdx] = f;
    if (f > 0) pitchValidCount++;
    pitchHistIdx = (pitchHistIdx + 1) % PITCH_HIST;
}
/* normalized autocorrelation of the centered window at a given lag */
function acfAt(off, n, mean, lag) {
    let num = 0, ea = 0, eb = 0;
    const lim = n - lag;
    for (let i = 0; i < lim; i++) {
        const a = floatTime[off + i] - mean;
        const b = floatTime[off + i + lag] - mean;
        num += a * b; ea += a * a; eb += b * b;
    }
    return (ea > 1e-12 && eb > 1e-12) ? num / Math.sqrt(ea * eb) : 0;
}
/* median of the valid pitches in the history ring (display smoothing) */
function medianPitch() {
    let n = 0;
    for (let i = 0; i < PITCH_HIST; i++) if (pitchHist[i] > 0) pitchScratch[n++] = pitchHist[i];
    if (!n) return 0;
    pitchScratch.sort();                       // zeros sort first
    return pitchScratch[PITCH_HIST - n + ((n - 1) >> 1)];
}
function detectVocals() {
    if (!analyser || !actx || !floatTime) return;
    if (analyser.getFloatTimeDomainData) analyser.getFloatTimeDomainData(floatTime);
    else for (let i = 0; i < floatTime.length; i++) floatTime[i] = (timeData[i] - 128) / 128;

    /* RMS gate — near-silence means nobody is singing */
    let rms = 0;
    for (let i = 0; i < floatTime.length; i++) rms += floatTime[i] * floatTime[i];
    rms = Math.sqrt(rms / floatTime.length);
    if (rms < 0.008) {
        pushPitch(0);
        vocalLevel += (0 - vocalLevel) * 0.06;
        vocalPitch = 0; vocalPitchNorm = 0.5; vocalNote = '';
        return;
    }

    vocalFrame++;
    if ((vocalFrame & 1) === 0) {
        /* normalized autocorrelation on a centered 2048-sample window,
           lags covering 80 Hz–1.1 kHz (~1M ops at 30 Hz update rate) */
        const sr = actx.sampleRate;
        const N = 2048;
        const off = (floatTime.length - N) >> 1;
        let mean = 0;
        for (let i = 0; i < N; i++) mean += floatTime[off + i];
        mean /= N;
        const minLag = Math.max(2, Math.floor(sr / 1100));
        const maxLag = Math.min(N - 2, Math.ceil(sr / 80));
        let bestLag = 0, bestCorr = 0;
        for (let lag = minLag; lag <= maxLag; lag++) {
            const c = acfAt(off, N, mean, lag);
            if (c > bestCorr) { bestCorr = c; bestLag = lag; }
        }
        const clarity = bestCorr;
        let freq = 0;
        if (bestLag > 0) {
            /* parabolic interpolation around the peak for sub-bin accuracy */
            const c0 = acfAt(off, N, mean, bestLag - 1);
            const c2 = acfAt(off, N, mean, bestLag + 1);
            const denom = c0 - 2 * bestCorr + c2;
            let shift = denom < 0 ? 0.5 * (c0 - c2) / denom : 0;
            if (shift > 0.5) shift = 0.5; else if (shift < -0.5) shift = -0.5;
            freq = sr / (bestLag + shift);
        }
        pushPitch(clarity > 0.55 && freq >= 80 && freq <= 1100 ? freq : 0);
    }

    /* score: pitch stability dominates, vocal-band energy ratio supports */
    const stability = pitchValidCount / PITCH_HIST;
    const vocalScore = clamp01(0.65 * stability + 0.35 * clamp01((vocalRatio - 0.25) * 2.2));
    vocalLevel += (vocalScore - vocalLevel) * (vocalScore > vocalLevel ? 0.25 : 0.06);  // fast attack, slow release

    const med = medianPitch();
    if (med > 0) {
        vocalPitch = med;
        vocalPitchNorm = clamp01((med - 80) / (1100 - 80));
        const nn = Math.round(12 * Math.log2(med / 440)) + 69;
        vocalNote = NOTE_NAMES[((nn % 12) + 12) % 12] + (Math.floor(nn / 12) - 1);
    } else {
        vocalPitch = 0; vocalPitchNorm = 0.5; vocalNote = '';
    }
}

/* ==========================================================================
   4. Renderers — every mode consumes bandEnv[] (96 log bands, bass->treble),
      timeData (oscilloscope), beatPulse and level. Warm ember palette.
   ========================================================================== */
const TAU = Math.PI * 2;
let W = 0, H = 0;                 // canvas CSS pixels
let rotOrbit = 0, rotSpiral = 0;  // persistent rotation state
/* nebula state: A starfield / B gas clouds / C swarm / shockwaves / vocal comet */
const nebStars = [], nebClouds = [], nebParticles = [], nebShocks = [];
let glowSprites = null, cloudSprites = null, cometSprite = null;
let spritesForLight = null;       // theme the sprites were built for (rebuild on flip)
let nebLastBeat = 0, cometAngle = 0, cometWasActive = false;
const COMET_TRAIL = 24;
const cometTrail = [];
let cometTrailIdx = 0;
for (let i = 0; i < COMET_TRAIL; i++) cometTrail.push({ x: 0, y: 0 });

const isLight = () => document.documentElement.dataset.theme === 'light';

function hueFor(i) { return 6 + (i / (BAND_COUNT - 1)) * 44; }   // ember red -> amber gold
function bandColor(i, alpha, light) {
    const l = (light === undefined ? 58 : light) + (isLight() ? -12 : 0);
    return `hsla(${hueFor(i)}, 92%, ${l}%, ${alpha})`;
}

function clearFrame() {
    ctx2d.clearRect(0, 0, W, H);
}

/* ---------- shared idle breathing glow ---------- */
function drawIdle(t) {
    clearFrame();
    const cx = W / 2, cy = H / 2;
    const breathe = reduceMotion ? 0.5 : (Math.sin(t * 0.0009) * 0.5 + 0.5);
    const r = Math.min(W, H) * (0.11 + breathe * 0.03);
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, r * 2.3);
    const a = isLight() ? 0.09 : 0.13;
    g.addColorStop(0, `rgba(255, 122, 60, ${a * (0.6 + breathe * 0.4)})`);
    g.addColorStop(0.5, `rgba(255, 77, 46, ${a * 0.3})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, W, H);
    /* faint ring hint */
    ctx2d.beginPath();
    ctx2d.arc(cx, cy, r, 0, TAU);
    ctx2d.strokeStyle = `rgba(255, 176, 77, ${0.12 + breathe * 0.12})`;
    ctx2d.lineWidth = 1.5;
    ctx2d.stroke();
}

/* ---------- Mode 1: Circular — 360° spectrum ring, bass at top, pulsing core ---------- */
function drawCircular(t) {
    clearFrame();
    const cx = W / 2, cy = H / 2;
    const baseR = Math.min(W, H) * 0.24;
    const maxAmp = Math.min(W, H) * 0.19;

    /* pulsing core */
    const coreR = baseR * (0.5 + bassLevel * 0.28) * (1 + beatPulse * 0.22);
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.6);
    g.addColorStop(0, `rgba(255, 176, 77, ${0.5 + beatPulse * 0.3})`);
    g.addColorStop(0.45, `rgba(255, 77, 46, ${0.22 + bassLevel * 0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(cx - coreR * 3, cy - coreR * 3, coreR * 6, coreR * 6);

    /* base ring */
    ctx2d.beginPath();
    ctx2d.arc(cx, cy, baseR, 0, TAU);
    ctx2d.strokeStyle = isLight() ? 'rgba(120,70,25,0.25)' : 'rgba(255,176,77,0.18)';
    ctx2d.lineWidth = 1;
    ctx2d.stroke();

    /* spectrum polygon — bass at top, continuing clockwise around 360° */
    ctx2d.beginPath();
    for (let i = 0; i <= BAND_COUNT; i++) {
        const k = i % BAND_COUNT;
        const ang = -Math.PI / 2 + (i / BAND_COUNT) * TAU;
        const r = baseR + bandEnv[k] * maxAmp * (1 + beatPulse * 0.15);
        const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
    }
    ctx2d.closePath();
    ctx2d.strokeStyle = `rgba(255, 140, 70, 0.95)`;
    ctx2d.lineWidth = 2.4;
    ctx2d.lineJoin = 'round';
    ctx2d.shadowColor = 'rgba(255, 122, 60, 0.8)';
    ctx2d.shadowBlur = 18;
    ctx2d.stroke();
    ctx2d.shadowBlur = 0;

    /* radial spokes + tip dots */
    for (let i = 0; i < BAND_COUNT; i++) {
        const e = bandEnv[i];
        if (e < 0.03) continue;
        const ang = -Math.PI / 2 + (i / BAND_COUNT) * TAU;
        const c = Math.cos(ang), s = Math.sin(ang);
        const rTip = baseR + e * maxAmp * (1 + beatPulse * 0.15);
        ctx2d.beginPath();
        ctx2d.moveTo(cx + c * baseR, cy + s * baseR);
        ctx2d.lineTo(cx + c * rTip, cy + s * rTip);
        ctx2d.strokeStyle = bandColor(i, 0.25 + e * 0.6);
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
        ctx2d.beginPath();
        ctx2d.arc(cx + c * rTip, cy + s * rTip, 1.4 + e * 2.2, 0, TAU);
        ctx2d.fillStyle = bandColor(i, 0.5 + e * 0.5, 62);
        ctx2d.fill();
    }
}

/* ---------- Mode 2: Bars — classic spectrum, left=bass, right=treble, peak caps ---------- */
function drawBars() {
    clearFrame();
    const n = BAND_COUNT;
    const gap = 2;
    const barW = Math.max(2, W / n - gap);
    const floor = H * 0.86, maxH = H * 0.66;

    /* baseline */
    ctx2d.fillStyle = isLight() ? 'rgba(120,70,25,0.28)' : 'rgba(255,176,77,0.22)';
    ctx2d.fillRect(0, floor, W, 1.5);

    for (let i = 0; i < n; i++) {
        const e = bandEnv[i];
        const h = Math.max(2, e * maxH * (1 + beatPulse * 0.06));
        const x = i * (W / n) + gap / 2;
        const y = floor - h;

        const grad = ctx2d.createLinearGradient(0, floor, 0, y);
        grad.addColorStop(0, bandColor(i, 0.55));
        grad.addColorStop(1, bandColor(i, 0.95, 64));
        ctx2d.fillStyle = grad;
        ctx2d.beginPath();
        if (ctx2d.roundRect) ctx2d.roundRect(x, y, barW, h, Math.min(4, barW / 2));
        else ctx2d.rect(x, y, barW, h);
        ctx2d.fill();

        /* glow tip */
        ctx2d.fillStyle = bandColor(i, 0.35 + e * 0.5, 70);
        ctx2d.fillRect(x, y - 2, barW, 3);

        /* reflection */
        ctx2d.fillStyle = bandColor(i, 0.10 + e * 0.10);
        ctx2d.fillRect(x, floor + 2, barW, h * 0.28);

        /* falling peak cap */
        barsCap[i] = Math.max(e, barsCap[i] - 0.012);
        const cy = floor - barsCap[i] * maxH - 5;
        ctx2d.fillStyle = `hsla(${hueFor(i)}, 95%, ${isLight() ? 42 : 74}%, 0.95)`;
        ctx2d.fillRect(x, cy, barW, 3);
    }
}

/* ---------- Mode 3: Wave — true oscilloscope with glow trail ---------- */
function drawWave() {
    clearFrame();
    const mid = H / 2;
    const amp = H * 0.3 * (0.5 + level * 0.9);
    const len = timeData.length;

    const trace = (buf, alpha, width, blur) => {
        ctx2d.beginPath();
        for (let i = 0; i < len; i += 4) {
            const x = (i / (len - 1)) * W;
            const y = mid + ((buf[i] - 128) / 128) * amp;
            if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
        }
        ctx2d.strokeStyle = `rgba(255, 140, 70, ${alpha})`;
        ctx2d.lineWidth = width;
        ctx2d.lineJoin = 'round';
        ctx2d.shadowColor = 'rgba(255, 122, 60, 0.9)';
        ctx2d.shadowBlur = blur;
        ctx2d.stroke();
        ctx2d.shadowBlur = 0;
    };

    trace(prevTimeData, 0.16, 3, 8);     // glow trail (previous frame)
    trace(timeData, 0.95, 2.6, 22);      // live trace

    /* center line + beat flash */
    ctx2d.fillStyle = `rgba(255,176,77,${0.10 + beatPulse * 0.25})`;
    ctx2d.fillRect(0, mid - 0.75, W, 1.5);
    if (beatPulse > 0.05) {
        const g = ctx2d.createRadialGradient(W / 2, mid, 0, W / 2, mid, Math.min(W, H) * 0.5);
        g.addColorStop(0, `rgba(255,77,46,${beatPulse * 0.10})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx2d.fillStyle = g;
        ctx2d.fillRect(0, 0, W, H);
    }
    prevTimeData.set(timeData);
}

/* ---------- Mode 4: Orbit — waveform ring + treble-driven dashed rings ---------- */
function drawOrbit() {
    clearFrame();
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.26;
    rotOrbit += (reduceMotion ? 0.0006 : 0.002) + trebleLevel * 0.03;

    /* rotating dashed rings — speed follows treble */
    const rings = [0.62, 0.82, 1.22];
    for (let r = 0; r < rings.length; r++) {
        ctx2d.save();
        ctx2d.translate(cx, cy);
        ctx2d.rotate(rotOrbit * (r % 2 === 0 ? 1 : -1) * (1 + r * 0.4));
        ctx2d.beginPath();
        ctx2d.setLineDash([6, 14]);
        ctx2d.arc(0, 0, R * rings[r] * (1 + beatPulse * 0.05), 0, TAU);
        ctx2d.strokeStyle = bandColor(BAND_COUNT - 1 - r * 20, 0.35 + trebleLevel * 0.4);
        ctx2d.lineWidth = 1.6;
        ctx2d.stroke();
        ctx2d.setLineDash([]);
        ctx2d.restore();
    }

    /* waveform ring */
    const steps = 240, step = Math.floor(timeData.length / steps);
    ctx2d.beginPath();
    for (let i = 0; i <= steps; i++) {
        const s = timeData[(i * step) % timeData.length];
        const ang = (i / steps) * TAU - Math.PI / 2;
        const r = R * (1 + ((s - 128) / 128) * 0.55);
        const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
    }
    ctx2d.closePath();
    ctx2d.strokeStyle = 'rgba(255, 140, 70, 0.95)';
    ctx2d.lineWidth = 2.2;
    ctx2d.shadowColor = 'rgba(255, 122, 60, 0.85)';
    ctx2d.shadowBlur = 16;
    ctx2d.stroke();
    ctx2d.shadowBlur = 0;

    /* bass core */
    const coreR = R * 0.30 * (1 + bassLevel * 0.5 + beatPulse * 0.35);
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2);
    g.addColorStop(0, `rgba(255,176,77,${0.55 + beatPulse * 0.3})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(cx - coreR * 2, cy - coreR * 2, coreR * 4, coreR * 4);
}
/* ---------- Mode 5: Nebula — layered cinematic field: twinkling starfield,
   volumetric gas clouds on a flow field, a band-mapped glow swarm, beat
   shockwaves and a vocal comet that appears when singing is detected ------- */
const NEB_STARS = 90, NEB_CLOUDS = 6, NEB_PARTICLES = 220;

function makeGlowSprites() {
    const light = isLight();
    const dl = light ? 12 : 0;              // darker sprites stay visible on light bg
    glowSprites = [];
    const hues = 16;
    for (let h = 0; h < hues; h++) {
        const s = document.createElement('canvas');
        s.width = s.height = 64;
        const c = s.getContext('2d');
        const hue = 6 + (h / (hues - 1)) * 44;      // ember -> amber
        const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, `hsla(${hue}, 95%, ${68 - dl}%, 0.9)`);
        g.addColorStop(0.35, `hsla(${hue}, 92%, ${55 - dl}%, 0.45)`);
        g.addColorStop(1, `hsla(${hue}, 90%, ${50 - dl}%, 0)`);
        c.fillStyle = g;
        c.fillRect(0, 0, 64, 64);
        glowSprites.push(s);
    }
    /* brightest sprite — white-gold comet head/trail */
    cometSprite = document.createElement('canvas');
    cometSprite.width = cometSprite.height = 64;
    const cc = cometSprite.getContext('2d');
    const cg = cc.createRadialGradient(32, 32, 0, 32, 32, 32);
    cg.addColorStop(0, 'rgba(255, 248, 226, 0.95)');
    cg.addColorStop(0.3, 'rgba(255, 214, 140, 0.55)');
    cg.addColorStop(1, 'rgba(255, 190, 90, 0)');
    cc.fillStyle = cg;
    cc.fillRect(0, 0, 64, 64);
}

function makeCloudSprites() {
    cloudSprites = [];
    /* deep red -> coral -> amber -> gold */
    const cols = [
        [255, 60, 30], [255, 90, 45], [255, 122, 60],
        [255, 150, 70], [255, 176, 77], [255, 204, 110]
    ];
    for (let i = 0; i < NEB_CLOUDS; i++) {
        const s = document.createElement('canvas');
        s.width = s.height = 256;
        const c = s.getContext('2d');
        const col = cols[i];
        const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, `rgba(${col[0]}, ${col[1]}, ${col[2]}, 0.55)`);
        g.addColorStop(0.4, `rgba(${col[0]}, ${col[1]}, ${col[2]}, 0.22)`);
        g.addColorStop(1, `rgba(${col[0]}, ${col[1]}, ${col[2]}, 0)`);
        c.fillStyle = g;
        c.fillRect(0, 0, 256, 256);
        cloudSprites.push(s);
    }
}

/* re-seed the whole field (called on resize; guard against zero-size stage) */
function initParticles() {
    if (W <= 0 || H <= 0) return;
    const m = Math.min(W, H);
    nebStars.length = 0;
    for (let i = 0; i < NEB_STARS; i++) {
        nebStars.push({
            x: Math.random() * W, y: Math.random() * H,
            r: 0.5 + Math.random() * 2,              // 1–2.5 px dots
            phase: Math.random() * TAU,
            speed: 0.0008 + Math.random() * 0.0022   // twinkle rad/ms
        });
    }
    nebClouds.length = 0;
    for (let i = 0; i < NEB_CLOUDS; i++) {
        nebClouds.push({
            sprite: i,
            x: W * (0.2 + Math.random() * 0.6),
            y: H * (0.2 + Math.random() * 0.6),
            vx: 0, vy: 0,
            orbit: Math.random() * TAU,
            orbitR: m * (0.08 + Math.random() * 0.22),
            orbitSpeed: (Math.random() < 0.5 ? -1 : 1) * (0.0004 + Math.random() * 0.0008),
            scale: 0.5 + Math.random() * 0.6,        // 0.5–1.1 × min(W,H)
            breathe: Math.random() * TAU,
            breatheSpeed: 0.0004 + Math.random() * 0.0008,
            bandGroup: i % 3                          // 0 bass, 1 mid, 2 treble
        });
    }
    nebParticles.length = 0;
    for (let i = 0; i < NEB_PARTICLES; i++) {
        nebParticles.push({
            x: Math.random() * W, y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            spd: 0.3 + Math.random() * 0.7,          // base speed 0.3–1.0 px/frame
            band: Math.floor(i * BAND_COUNT / NEB_PARTICLES)
        });
    }
    nebShocks.length = 0;
}

function drawNebula(t) {
    clearFrame();
    const light = isLight();
    if (!glowSprites || spritesForLight !== light) {
        makeGlowSprites();
        makeCloudSprites();
        spritesForLight = light;
    }
    if (!nebParticles.length) initParticles();
    const cx = W / 2, cy = H / 2;
    const m = Math.min(W, H);
    const motionScale = reduceMotion ? 0.4 : 1;

    /* --- Layer A: starfield (normal composite, treble lifts brightness) --- */
    ctx2d.globalCompositeOperation = 'source-over';
    for (let i = 0; i < nebStars.length; i++) {
        const s = nebStars[i];
        const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
        let a = (0.25 + tw * 0.55) * (0.7 + trebleLevel * 0.6);
        if (a > 1) a = 1;
        /* darker gold on light backgrounds so stars stay visible */
        ctx2d.fillStyle = light ? `rgba(170, 110, 35, ${a * 0.7})` : `rgba(255, 236, 200, ${a})`;
        ctx2d.beginPath();
        ctx2d.arc(s.x, s.y, s.r, 0, TAU);
        ctx2d.fill();
    }

    ctx2d.globalCompositeOperation = 'lighter';

    /* --- Layer B: volumetric gas clouds (additive, energy-band breathing) --- */
    for (let i = 0; i < nebClouds.length; i++) {
        const c = nebClouds[i];
        /* slow flow-field drift */
        const fa = (Math.sin(c.x * 0.0016 + t * 0.00021) +
                    Math.cos(c.y * 0.0019 - t * 0.00017)) * Math.PI;
        c.vx += (Math.cos(fa) * 0.18 - c.vx) * 0.02;
        c.vy += (Math.sin(fa) * 0.18 - c.vy) * 0.02;
        /* gentle rotation of position around center */
        c.orbit += c.orbitSpeed * motionScale * (1 + beatPulse * 0.5);
        const ox = cx + Math.cos(c.orbit) * c.orbitR;
        const oy = cy + Math.sin(c.orbit) * c.orbitR;
        c.x += c.vx * motionScale + (ox - c.x) * 0.004;
        c.y += c.vy * motionScale + (oy - c.y) * 0.004;
        c.breathe += c.breatheSpeed * motionScale;
        const e = c.bandGroup === 0 ? bassLevel : (c.bandGroup === 1 ? midLevel : trebleLevel);
        const size = m * c.scale * (1 + Math.sin(c.breathe) * 0.08) * (1 + e * 0.15);
        let a = 0.05 + e * 0.11;
        if (a > 0.16) a = 0.16;
        if (light) a *= 0.45;
        ctx2d.globalAlpha = a;
        ctx2d.drawImage(cloudSprites[c.sprite], c.x - size / 2, c.y - size / 2, size, size);
    }
    ctx2d.globalAlpha = 1;

    /* --- beat shockwaves: expanding ember rings + radial particle kick --- */
    if (beatCount !== nebLastBeat) {
        nebLastBeat = beatCount;
        nebShocks.push({ r: 0, a: 0.55 });
        for (let i = 0; i < nebParticles.length; i++) {
            const p = nebParticles[i];
            const dx = p.x - cx, dy = p.y - cy;
            const d = Math.max(40, Math.sqrt(dx * dx + dy * dy));
            p.vx += (dx / d) * 1.4;
            p.vy += (dy / d) * 1.4;
        }
    }
    for (let i = nebShocks.length - 1; i >= 0; i--) {
        const s = nebShocks[i];
        s.r += 6 + beatPulse * 4;
        s.a *= 0.94;
        if (s.a < 0.02) { nebShocks.splice(i, 1); continue; }
        ctx2d.beginPath();
        ctx2d.arc(cx, cy, s.r, 0, TAU);
        ctx2d.strokeStyle = light ? `rgba(200, 90, 30, ${s.a * 0.7})` : `rgba(255, 122, 60, ${s.a})`;
        ctx2d.lineWidth = 1.5;
        ctx2d.stroke();
    }

    /* --- Layer C: flow-field glow swarm, one band per particle --- */
    const speedBoost = 1 + level * 2.5;
    for (let i = 0; i < nebParticles.length; i++) {
        const p = nebParticles[i];
        const e = bandEnv[p.band];
        const a = (Math.sin(p.x * 0.0016 + t * 0.00021) +
                   Math.cos(p.y * 0.0019 - t * 0.00017)) * Math.PI;
        /* desired velocity: flow-field direction + slight swirl around center */
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.max(60, Math.sqrt(dx * dx + dy * dy));
        const sp = p.spd * (0.4 + e * 1.6) * speedBoost * motionScale;
        const dvx = Math.cos(a) * sp + (-dy / d) * sp * 0.45;
        const dvy = Math.sin(a) * sp + (dx / d) * sp * 0.45;
        p.vx += (dvx - p.vx) * 0.06;             // lerp steering
        p.vy += (dvy - p.vy) * 0.06;
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -40) p.x = W + 40; else if (p.x > W + 40) p.x = -40;
        if (p.y < -40) p.y = H + 40; else if (p.y > H + 40) p.y = -40;

        const size = 2 + e * 26;
        ctx2d.globalAlpha = 0.15 + e * 0.7;
        ctx2d.drawImage(glowSprites[Math.min(15, (p.band * 16 / BAND_COUNT) | 0)],
                        p.x - size / 2, p.y - size / 2, size, size);
    }
    ctx2d.globalAlpha = 1;

    /* --- vocal comet: white-gold head + fading trail while singing --- */
    if (vocalLevel > 0.15) {
        if (!cometWasActive) {                   // reset stale trail on re-entry
            for (let i = 0; i < COMET_TRAIL; i++) { cometTrail[i].x = 0; cometTrail[i].y = 0; }
            cometWasActive = true;
        }
        cometAngle += (0.02 + vocalLevel * 0.05) * motionScale;
        const cr = m * (0.14 + vocalPitchNorm * 0.2);
        const hx = cx + Math.cos(cometAngle) * cr;
        const hy = cy + Math.sin(cometAngle) * cr;
        const tp = cometTrail[cometTrailIdx];
        tp.x = hx; tp.y = hy;
        cometTrailIdx = (cometTrailIdx + 1) % COMET_TRAIL;
        const headSize = 14 + vocalLevel * 30;
        for (let i = 0; i < COMET_TRAIL; i++) {
            const tr = cometTrail[(cometTrailIdx - 1 - i + COMET_TRAIL * 2) % COMET_TRAIL];
            if (tr.x === 0 && tr.y === 0) continue;
            const f = 1 - i / COMET_TRAIL;       // newest first, fading out
            const ts = headSize * f * 0.6;
            ctx2d.globalAlpha = vocalLevel * f * 0.35;
            ctx2d.drawImage(cometSprite, tr.x - ts / 2, tr.y - ts / 2, ts, ts);
        }
        ctx2d.globalAlpha = Math.min(1, 0.4 + vocalLevel * 0.6);
        ctx2d.drawImage(cometSprite, hx - headSize / 2, hy - headSize / 2, headSize, headSize);
        ctx2d.globalAlpha = 1;
    } else {
        cometWasActive = false;
    }
    ctx2d.globalCompositeOperation = 'source-over';
}

/* ---------- Mode 6: Spiral — frequency ribbon along a rotating spiral ---------- */
function drawSpiral() {
    clearFrame();
    const cx = W / 2, cy = H / 2;
    const maxR = Math.min(W, H) * 0.42;
    rotSpiral += (reduceMotion ? 0.0005 : 0.0016) + level * 0.012;

    ctx2d.lineCap = 'round';
    let px = cx, py = cy;
    for (let i = 0; i < BAND_COUNT; i++) {
        const t = i / (BAND_COUNT - 1);
        const e = bandEnv[i];
        /* neighbor-smoothed energy keeps the ribbon coherent, not jagged */
        const sE = (bandEnv[Math.max(0, i - 1)] + e * 2 + bandEnv[Math.min(BAND_COUNT - 1, i + 1)]) / 4;
        const ang = rotSpiral + t * TAU * 3 - Math.PI / 2;      // 3 turns, bass inside
        const r = (18 + t * maxR * (0.55 + sE * 0.4)) * (1 + beatPulse * 0.04);
        const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        if (i > 0) {
            ctx2d.beginPath();
            ctx2d.moveTo(px, py);
            ctx2d.lineTo(x, y);
            ctx2d.strokeStyle = bandColor(i, 0.30 + e * 0.65);
            ctx2d.lineWidth = 1.5 + e * 9;
            ctx2d.shadowColor = bandColor(i, 0.8);
            ctx2d.shadowBlur = e * 14;
            ctx2d.stroke();
            ctx2d.shadowBlur = 0;
        }
        px = x; py = y;
    }
    /* tip glow */
    ctx2d.beginPath();
    ctx2d.arc(px, py, 3 + bandEnv[BAND_COUNT - 1] * 8, 0, TAU);
    ctx2d.fillStyle = bandColor(BAND_COUNT - 1, 0.9, 70);
    ctx2d.fill();

    /* center core */
    const coreR = 10 + bassLevel * 26 + beatPulse * 10;
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.2);
    g.addColorStop(0, `rgba(255,176,77,${0.5 + beatPulse * 0.3})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(cx - coreR * 2.2, cy - coreR * 2.2, coreR * 4.4, coreR * 4.4);
}

/* ==========================================================================
   5. Main loop — DPR-aware, paused when tab hidden, reduced-motion aware.
   ========================================================================== */
const RENDERERS = [drawCircular, drawBars, drawWave, drawOrbit, drawNebula, drawSpiral];
let rafId = null, lastFrame = 0;

/* golden aura + on-canvas pitch badge, drawn over every mode while singing
   is detected (on-canvas so it also shows in fullscreen) */
function drawVocalOverlay() {
    const cx = W / 2, cy = H / 2;
    const m = Math.min(W, H);
    ctx2d.globalCompositeOperation = 'lighter';
    const r = m * (0.3 + vocalLevel * 0.25);
    const a = 0.10 * vocalLevel * (isLight() ? 0.6 : 1);
    const g = ctx2d.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(255, 226, 160, ${a})`);
    g.addColorStop(1, 'rgba(255, 226, 160, 0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx2d.globalCompositeOperation = 'source-over';

    /* pitch badge — glassy pill, bottom-right */
    const label = vocalPitch > 0 ? `♪ ${vocalNote}` : '♪ vocals';
    ctx2d.font = 'bold 15px "Segoe UI", system-ui, -apple-system, sans-serif';
    const bw = ctx2d.measureText(label).width + 20;   // 10 px padding each side
    const bh = 34;
    const x = W - bw - 18, y = H - bh - 18;
    ctx2d.beginPath();
    if (ctx2d.roundRect) ctx2d.roundRect(x, y, bw, bh, 12);
    else ctx2d.rect(x, y, bw, bh);
    ctx2d.fillStyle = 'rgba(20,12,8,0.55)';
    ctx2d.fill();
    ctx2d.strokeStyle = 'rgba(255,178,120,0.35)';
    ctx2d.lineWidth = 1;
    ctx2d.stroke();
    ctx2d.fillStyle = `rgba(255,214,140,${0.4 + vocalLevel * 0.6})`;
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText(label, x + bw / 2, y + bh / 2 + 0.5);
    ctx2d.textAlign = 'start';
    ctx2d.textBaseline = 'alphabetic';
}

function frame(t) {
    rafId = requestAnimationFrame(frame);
    const dt = t - lastFrame;
    lastFrame = t;
    if (dt > 250) return;                    // tab was backgrounded; skip stale frame

    analyse(t);
    beatPulse *= 0.9;

    if (activeSource === 'none') drawIdle(t);
    else {
        RENDERERS[modeIndex](t);
        if (vocalLevel > 0.12) drawVocalOverlay();
    }
}
function startLoop() { if (rafId === null) rafId = requestAnimationFrame(frame); }
function stopLoop() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

function resizeCanvas() {
    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
}
window.addEventListener('resize', resizeCanvas);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLoop();
    else { lastFrame = 0; startLoop(); }
});
/* ==========================================================================
   6. Title chip — aria-live status, transient messages auto-revert.
   ========================================================================== */
let chipTimer = null;
function chip(msg, transient) {
    chipText.textContent = msg;
    if (chipTimer) { clearTimeout(chipTimer); chipTimer = null; }
    if (transient) {
        chipTimer = setTimeout(() => chipText.textContent = trackTitle, 4500);
    }
}
function setTrack(title) {
    trackTitle = title;
    chip(title, false);
}

/* ==========================================================================
   7. File playback (hidden <audio>, volume-independent visuals)
   ========================================================================== */
let seeking = false;

function fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
}
function updateTime() {
    timeLabel.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    if (!seeking && isFinite(audio.duration) && audio.duration > 0) {
        seekSlider.value = Math.round((audio.currentTime / audio.duration) * 1000);
    }
}
audio.addEventListener('timeupdate', () => { if (!seeking) updateTime(); });
audio.addEventListener('loadedmetadata', () => { seekSlider.disabled = false; updateTime(); });
audio.addEventListener('ended', () => { setPlayingUI(false); });
audio.addEventListener('error', () => {
    if (objectUrl) chip("Couldn't decode that file — try a different audio file", true);
});
seekSlider.addEventListener('pointerdown', () => { seeking = true; });
seekSlider.addEventListener('input', () => {
    if (isFinite(audio.duration) && audio.duration > 0) {
        timeLabel.textContent = `${fmtTime((seekSlider.value / 1000) * audio.duration)} / ${fmtTime(audio.duration)}`;
    }
});
const endSeek = () => {
    if (seeking && isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (seekSlider.value / 1000) * audio.duration;
    }
    seeking = false;
};
seekSlider.addEventListener('change', endSeek);
seekSlider.addEventListener('pointerup', endSeek);

const AUDIO_EXTS = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|webm|mp4)$/i;
function handleFile(file) {
    if (!file) return;
    if (!(file.type && file.type.startsWith('audio/')) && !AUDIO_EXTS.test(file.name)) {
        chip("That doesn't look like an audio file", true);
        return;
    }
    if (!ensureAudio()) { chip('Web Audio is not supported in this browser', true); return; }
    resumeAudio();
    stopDemo();
    stopMic();
    if (!elementSource) {
        elementSource = actx.createMediaElementSource(audio);
        elementSource.connect(analyser);        // visuals branch (pre-volume)
        elementSource.connect(masterGain);      // audible branch
    }
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    audio.src = objectUrl;
    activeSource = 'file';
    setTrack(file.name.replace(/\.[^.]+$/, ''));
    audio.play().then(() => setPlayingUI(true)).catch(() => {
        setPlayingUI(false);
        if (!audio.error) chip('Press play to start', true);   // don't mask decode errors
    });
}
function setPlayingUI(playing) {
    icoPlay.style.display = playing ? 'none' : '';
    icoPause.style.display = playing ? '' : 'none';
}
function togglePlay() {
    if (activeSource === 'file' && audio.src) {
        resumeAudio();
        if (audio.paused) audio.play().then(() => setPlayingUI(true)).catch(() => {});
        else { audio.pause(); setPlayingUI(false); }
    } else {
        toggleDemo();   // no file loaded — play button drives the demo track
    }
}

/* ==========================================================================
   8. Generative demo — A-F-G-E ambient pad + bass pulse + sparkle + 620ms
      sine kick (drives beat detection). Routed to analyser AND masterGain.
   ========================================================================== */
let demoOn = false, demoBusy = false;
let demoBus = null, demoTimer = null, demoNodes = [], demoNoise = null;
let nextKickAt = 0, nextPulseAt = 0, nextPadAt = 0, padStep = 0;
const PAD_NOTES = [220.0, 174.61, 196.0, 164.81];   // A3 F3 G3 E3

function scheduleKick(at) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, at);
    o.frequency.exponentialRampToValueAtTime(42, at + 0.12);
    g.gain.setValueAtTime(0.9, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.28);
    o.connect(g); g.connect(demoBus);
    o.start(at); o.stop(at + 0.3);
}
function schedulePulse(at) {
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'square'; o.frequency.value = 55;
    f.type = 'lowpass'; f.frequency.value = 180;
    g.gain.setValueAtTime(0.22, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.22);
    o.connect(f); f.connect(g); g.connect(demoBus);
    o.start(at); o.stop(at + 0.25);
}
function scheduleHat(at) {
    if (!demoNoise) return;
    const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
    s.buffer = demoNoise;
    f.type = 'highpass'; f.frequency.value = 5200;
    g.gain.setValueAtTime(0.16, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.07);
    s.connect(f); f.connect(g); g.connect(demoBus);
    s.start(at); s.stop(at + 0.1);
}
function scheduleSparkle(at) {
    const notes = [1568.0, 2093.0, 2637.0, 3136.0, 4186.0];
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = notes[Math.floor(Math.random() * notes.length)];
    g.gain.setValueAtTime(0.05, at);
    g.gain.exponentialRampToValueAtTime(0.0005, at + 0.35);
    o.connect(g); g.connect(demoBus);
    o.start(at); o.stop(at + 0.4);
}
function demoScheduler() {
    if (!demoOn) return;
    const ahead = actx.currentTime + 0.45;
    while (nextKickAt < ahead) { scheduleKick(nextKickAt); nextKickAt += 0.62; }
    while (nextPulseAt < ahead) {
        schedulePulse(nextPulseAt + 0.31);
        scheduleHat(nextPulseAt + 0.155);          // 16th offbeats keep treble alive
        scheduleHat(nextPulseAt + 0.465);
        nextPulseAt += 0.62;
    }
    if (Math.random() < 0.55) scheduleSparkle(actx.currentTime + 0.05 + Math.random() * 0.3);
    if (actx.currentTime >= nextPadAt) {
        padStep = (padStep + 1) % PAD_NOTES.length;
        const f = PAD_NOTES[padStep];
        for (const n of demoNodes) {
            if (n.freqRatio) n.osc.frequency.setTargetAtTime(f * n.freqRatio, actx.currentTime, 0.6);
        }
        nextPadAt = actx.currentTime + 2.5;
    }
}
function startDemo() {
    if (demoOn || demoBusy) return;
    demoBusy = true;
    if (!ensureAudio()) { chip('Web Audio is not supported in this browser', true); demoBusy = false; return; }
    resumeAudio();
    stopMic();
    audio.pause(); setPlayingUI(false);

    demoBus = actx.createGain();
    demoBus.gain.value = 0.85;
    demoBus.connect(analyser);          // visuals
    demoBus.connect(masterGain);        // audible

    /* ambient pad: detuned triangle pair through a slow lowpass */
    const padFilter = actx.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.frequency.value = 850; padFilter.Q.value = 0.6;
    const padGain = actx.createGain(); padGain.gain.value = 0.09;
    padFilter.connect(padGain); padGain.connect(demoBus);
    const pad1 = actx.createOscillator(), pad2 = actx.createOscillator(), pad3 = actx.createOscillator();
    pad1.type = pad2.type = pad3.type = 'triangle';
    pad1.frequency.value = PAD_NOTES[0];
    pad2.frequency.value = PAD_NOTES[0] * 1.5;  pad2.detune.value = 4;
    pad3.frequency.value = PAD_NOTES[0] * 2.0;  pad3.detune.value = -5;
    pad1.connect(padFilter); pad2.connect(padFilter); pad3.connect(padFilter);
    pad1.start(); pad2.start(); pad3.start();
    demoNodes = [
        { osc: pad1, freqRatio: 1 }, { osc: pad2, freqRatio: 1.5 }, { osc: pad3, freqRatio: 2 },
        { osc: null }, padFilter, padGain
    ];

    /* short white-noise buffer for hi-hats */
    if (!demoNoise) {
        demoNoise = actx.createBuffer(1, actx.sampleRate * 0.12, actx.sampleRate);
        const d = demoNoise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    const now = actx.currentTime;
    nextKickAt = now + 0.1;
    nextPulseAt = now + 0.1;
    nextPadAt = now + 2.5;
    demoTimer = setInterval(demoScheduler, 180);

    demoOn = true;
    activeSource = 'demo';
    btnDemo.classList.add('active');
    setTrack('Generative demo — Ember Drift');
    demoBusy = false;
}
function stopDemo() {
    if (!demoOn) return;
    demoOn = false;
    btnDemo.classList.remove('active');
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    try {
        if (demoBus) demoBus.gain.setTargetAtTime(0.0001, actx.currentTime, 0.05);
        for (const n of demoNodes) {
            if (n.osc) { try { n.osc.stop(actx.currentTime + 0.25); } catch (e) {} }
        }
        const bus = demoBus, nodes = demoNodes;
        setTimeout(() => {
            try { bus.disconnect(); } catch (e) {}
            for (const n of nodes) { try { n.disconnect ? n.disconnect() : null; } catch (e) {} }
        }, 400);
    } catch (e) { /* graph already torn down */ }
    demoBus = null; demoNodes = [];
    if (activeSource === 'demo') {
        activeSource = 'none';
        setTrack('No track loaded');
    }
}
function toggleDemo() { demoOn ? stopDemo() : startDemo(); }

/* ==========================================================================
   9. Microphone — analyser only, guarded, friendly failure via chip.
   ========================================================================== */
let micBusy = false;
function stopMic() {
    if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode = null; }
    if (micStream) {
        for (const t of micStream.getTracks()) { try { t.stop(); } catch (e) {} }
        micStream = null;
    }
    btnMic.classList.remove('active');
    if (activeSource === 'mic') {
        activeSource = 'none';
        setTrack('No track loaded');
    }
}
async function toggleMic() {
    if (micBusy) return;                 // in-flight guard (double-click safe)
    micBusy = true;
    try {
        if (micStream) {
            stopMic();
            chip('Microphone off', true);
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            chip('Microphone unavailable — this page needs a secure (HTTPS) context', true);
            return;
        }
        if (!ensureAudio()) { chip('Web Audio is not supported in this browser', true); return; }
        resumeAudio();
        let stream;
        try {
            /* raw vocal capture: keep the sung signal unprocessed for pitch tracking */
            stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
            });
        } catch (e) {
            /* constraints unsupported — defensive fallback to a plain request */
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        if (!micBusy) { stream.getTracks().forEach(t => t.stop()); return; }  // raced guard
        stopDemo();
        audio.pause(); setPlayingUI(false);
        micStream = stream;
        micNode = actx.createMediaStreamSource(stream);
        micNode.connect(analyser);       // analysis only — never to destination
        btnMic.classList.add('active');
        activeSource = 'mic';
        setTrack('Live microphone — sing!');
    } catch (err) {
        /* NotAllowedError / NotFoundError / SecurityError / NotReadableError:
           expected user/environment conditions — friendly chip, silent console. */
        stopMic();
        chip('Microphone blocked — allow access or open the page directly', true);
    } finally {
        micBusy = false;
    }
}
/* ==========================================================================
   10. Fullscreen — real API first, silent CSS "theater mode" fallback for
       sandboxed iframes. Never logs.
   ========================================================================== */
let theater = false;
async function toggleFullscreen() {
    if (theater) {
        document.body.classList.remove('theater');
        theater = false;
        btnFs.classList.remove('active');
        return;
    }
    if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (e) { /* already exited */ }
        return;
    }
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (!req) { enterTheater(); return; }
    try {
        await req.call(stage, { navigationUI: 'hide' });
        btnFs.classList.add('active');
    } catch (e) {
        enterTheater();                 // permission/API unavailable in iframe — CSS twin
    }
}
function enterTheater() {
    theater = true;
    document.body.classList.add('theater');
    btnFs.classList.add('active');
}
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) btnFs.classList.remove('active');
});

/* ==========================================================================
   11. Controls wiring, auto-hide chrome, drag & drop, keyboard.
   ========================================================================== */
function cycleMode(dir) {
    modeIndex = (modeIndex + (dir || 1) + MODES.length) % MODES.length;
    modeName.textContent = MODES[modeIndex];
    save('dp-viz-mode', String(modeIndex));
    chip(`Mode: ${MODES[modeIndex]}`, true);
}

btnUpload.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    handleFile(fileInput.files && fileInput.files[0]);
    fileInput.value = '';
});
btnPlay.addEventListener('click', togglePlay);
btnMode.addEventListener('click', () => cycleMode(1));
btnMic.addEventListener('click', toggleMic);
btnDemo.addEventListener('click', toggleDemo);
btnFs.addEventListener('click', toggleFullscreen);

volSlider.addEventListener('input', () => {
    if (masterGain) masterGain.gain.setTargetAtTime(Math.pow(volSlider.value / 100, 1.5), actx.currentTime, 0.03);
    save('dp-viz-vol', volSlider.value);
});

/* auto-hide chrome after 3 s of inactivity */
let hideTimer = null;
function pokeUI() {
    document.body.classList.remove('ui-hidden');
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.add('ui-hidden'), 3000);
}
['mousemove', 'pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(ev =>
    window.addEventListener(ev, pokeUI, { passive: true }));

/* drag & drop with overlay */
const dropOverlay = $('dropOverlay');
let dragDepth = 0;
window.addEventListener('dragenter', e => {
    e.preventDefault();
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
        dragDepth++;
        dropOverlay.classList.add('show');
    }
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
    e.preventDefault();
    if (--dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); }
});
window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('show');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
});

/* corner menu */
const menuBtn = $('menuBtn'), menuPanel = $('menuPanel');
menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = !menuPanel.classList.contains('open');
    menuPanel.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
});
window.addEventListener('pointerdown', e => {
    if (menuPanel.classList.contains('open') && !menuPanel.contains(e.target) && e.target !== menuBtn) {
        menuPanel.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
    }
});

/* keyboard shortcuts — never fire from interactive elements */
function isInteractiveTarget(t) {
    return !!(t && t.closest && t.closest('button, input, select, textarea, a, [contenteditable="true"]'));
}
window.addEventListener('keydown', e => {
    if (isInteractiveTarget(e.target)) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'KeyM') { toggleMic(); }
    else if (e.code === 'KeyV') { cycleMode(1); }
});

/* ==========================================================================
   12. Theme & font (persisted through the safe storage shim)
   ========================================================================== */
const themeToggle = $('themeToggle'), fontSelect = $('fontSelect');
const FONTS = {
    system: '"Segoe UI", system-ui, -apple-system, sans-serif',
    serif: 'Georgia, "Times New Roman", serif',
    verdana: 'Verdana, Geneva, sans-serif',
    mono: '"Cascadia Code", "Courier New", monospace'
};
function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeToggle.textContent = theme === 'light' ? 'Light' : 'Dark';
    save('dp-viz-theme', theme);
}
function applyFont(key) {
    document.documentElement.style.setProperty('--font', FONTS[key] || FONTS.system);
    fontSelect.value = key;
    save('dp-viz-font', key);
}
themeToggle.addEventListener('click', () =>
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
fontSelect.addEventListener('change', () => applyFont(fontSelect.value));

/* ==========================================================================
   13. Init
   ========================================================================== */
(function init() {
    applyTheme(load('dp-viz-theme') || 'dark');
    applyFont(load('dp-viz-font') || 'system');
    const savedMode = parseInt(load('dp-viz-mode') || '0', 10);
    modeIndex = (savedMode >= 0 && savedMode < MODES.length) ? savedMode : 0;
    modeName.textContent = MODES[modeIndex];
    const savedVol = parseInt(load('dp-viz-vol') || '80', 10);
    volSlider.value = String(Math.min(100, Math.max(0, isNaN(savedVol) ? 80 : savedVol)));
    resizeCanvas();
    startLoop();
    pokeUI();
    requestAnimationFrame(() => document.body.classList.add('ready'));
})();

/* Minimal read-only hooks for automated verification (no side effects). */
window.__viz = {
    env: () => Array.from(bandEnv),
    bands: () => bands.map(b => b.freq),
    active: () => activeSource,
    level: () => level,
    bass: () => bassLevel,
    mid: () => midLevel,
    treble: () => trebleLevel,
    beat: () => beatPulse,
    beats: () => beatCount,
    mode: () => MODES[modeIndex]
};
</script>
</body>
</html>
