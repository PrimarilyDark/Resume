<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Versions - Dave Persaud</title>
    <style>
/* ============================================================
   Dave Persaud — Portfolio (compact revamp, ground-up)
   Design goals: zero dead space, warm low-saturation palette,
   dense but breathable layouts.
   ============================================================ */

:root {
    --bg: #faf8f4;
    --card: #ffffff;
    --ink: #292524;
    --muted: #78716c;
    --line: #e8e3da;
    --shadow: 0 4px 14px rgba(41, 37, 36, 0.06);
    --radius: 14px;
    --radius2: 10px;
    --green: #16a34a;
    --green-muted: #2e7d32;
    --accent: #c2410c;              /* warm clay */
    --accent-soft: rgba(194, 65, 12, 0.08);
    --nav-bg: rgba(250, 248, 244, 0.92);
    --nav-border: rgba(41, 37, 36, 0.08);
    --button-bg: #f0ede6;
    --button-text: #57534e;
    --global-font: Arial, sans-serif;

    /* Project accents */
    --btn-blue: #2563eb;
    --btn-dark: #292524;
    --scrap-red: #7f1d1d;
    --current-green: #166534;
    --orange-shop: #ea580c;
    --soft-green: #f0fdf4;
    --soft-red: #fff1f2;

    /* Experience / viz accents */
    --exp-card: #1c1917;
    --exp-line: #44403c;
    --exp-accent: #22c55e;
    --exp-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
}

[data-theme="dark"] {
    --bg: #1c1917;
    --card: #292524;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --line: #44403c;
    --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    --nav-bg: rgba(28, 25, 23, 0.92);
    --nav-border: rgba(250, 250, 249, 0.1);
    --button-bg: #44403c;
    --button-text: #d6d3d1;
    --accent: #fb923c;
    --accent-soft: rgba(251, 146, 60, 0.12);
}

html { scroll-behavior: smooth; }

body {
    font-family: var(--global-font);
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 20% 0%, var(--card) 0%, var(--bg) 55%, var(--bg) 100%);
    color: var(--ink);
    line-height: 1.55;
    transition: background 0.3s ease, color 0.3s ease;
}

/* ---------- Header ---------- */
header {
    padding: 20px 16px 14px;
    text-align: center;
}
header h1 {
    margin: 0;
    font-size: 1.9rem;
    color: var(--ink);
    letter-spacing: 0.5px;
}

/* ---------- Sticky nav ---------- */
nav {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 7px 0;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    z-index: 1000;
    border-bottom: 1px solid var(--nav-border);
    transition: background 0.3s ease, border-color 0.3s ease;
}
.nav-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 12px;
    position: relative;
}
nav a, nav button, .font-select-trigger {
    text-decoration: none;
    color: var(--button-text);
    background-color: var(--button-bg);
    padding: 6px 13px;
    border-radius: 16px;
    font-weight: 600;
    font-size: 0.82rem;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: var(--global-font);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
    height: 32px;
    box-sizing: border-box;
}
nav a:hover, nav button:hover, .font-select-trigger:hover {
    background-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
}
nav a:focus, nav button:focus, .font-select-trigger:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* ---------- Font dropdown ---------- */
.font-dropdown-wrapper { 
    position: relative; 
    display: inline-flex; 
    align-items: center;
}
.font-dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius2);
    box-shadow: var(--shadow);
    padding: 6px;
    min-width: 170px;
    display: none;
    flex-direction: column;
    gap: 3px;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.font-dropdown-menu.show-menu {
    display: flex;
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}
.font-option {
    background: transparent;
    color: var(--ink);
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
    transition: background 0.2s ease;
}
.font-option:hover, .font-option:focus {
    background: var(--button-bg);
    color: var(--accent);
    outline: none;
}

/* ---------- Layout ---------- */
.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 12px 16px;
}

section {
    background-color: var(--card);
    padding: 24px 22px;
    margin: 12px 0;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    text-align: center;
    scroll-margin-top: 64px;
    position: relative;
    transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
section h2 {
    font-size: 1.3rem;
    color: var(--accent);
    margin: 0 0 12px;
    display: inline-block;
    border-bottom: 2px solid var(--line);
    padding-bottom: 5px;
    transition: color 0.3s ease, border-color 0.3s ease;
}
section p {
    max-width: 700px;
    margin: 0 auto;
}

/* ---------- Back Link / Action Placement ---------- */
.back-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0 auto 16px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.88rem;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--accent-soft);
    border: 1px solid rgba(194, 65, 12, 0.15);
    transition: all 0.2s ease;
}
.back-link:hover {
    background: var(--accent);
    color: #ffffff;
    transform: translateY(-1px);
}

/* ---------- Projects List Layout ---------- */
.projects-list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
}
.project-row-link {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius2);
    border: 1px solid var(--line);
    background: var(--card);
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
    text-align: left;
    box-sizing: border-box;
}
.project-row-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(41, 37, 36, 0.06);
    border-color: var(--accent);
}
.project-meta-info {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    flex: 1 1 auto;
    min-width: 0;
}
.project-vector-icon {
    width: 36px;
    height: 36px;
    flex: 0 0 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #ffffff;
    font-weight: 900;
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(41, 37, 36, 0.12);
}
.project-vector-icon.color-blue { background: linear-gradient(135deg, #2563eb, #60a5fa); }
.project-vector-icon.color-dark { background: linear-gradient(135deg, #1c1917, #57534e); }

.project-headline-title { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.2; }
.project-sub-label { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; }

/* Properly anchored right-aligned action buttons */
.project-action-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 18px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 12px;
    color: #ffffff;
    background: var(--btn-blue);
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.15);
    white-space: nowrap;
    flex: 0 0 auto;
    box-sizing: border-box;
    height: 32px;
    margin-left: auto;
}
.project-action-button.type-alt { 
    background: var(--btn-dark); 
    box-shadow: 0 4px 10px rgba(28, 25, 23, 0.18); 
}

/* ---------- Footer ---------- */
footer {
    text-align: center;
    padding: 16px;
    color: var(--muted);
    font-size: 0.82rem;
}

@media (max-width: 560px) {
    .nav-container { gap: 4px; }
    nav a, nav button, .font-select-trigger { padding: 5px 10px; font-size: 0.78rem; height: 28px; }
    .project-row-link { padding: 8px 10px; }
}
    </style>
</head>
<body>

    <header>
        <h1>Old Versions</h1>
    </header>

    <nav>
        <div class="nav-container" id="mainNav">
            <a href="index.html#about">About</a>
            <a href="index.html#education">Education</a>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#experience">Experience</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#licenses">Licenses</a>
            <a href="index.html#files">Files</a>
            <button id="themeToggleBtn" type="button">Dark Mode</button>

            <div class="font-dropdown-wrapper">
                <button class="font-select-trigger" id="fontDropdownTrigger" type="button">Fonts ▾</button>
                <div class="font-dropdown-menu" id="fontDropdownMenu">
                    <button class="font-option" style="font-family: Arial, sans-serif;" onclick="changeGlobalFont('Arial, sans-serif')">Default (Arial)</button>
                    <button class="font-option" style="font-family: 'Times New Roman', serif;" onclick="changeGlobalFont('\'Times New Roman\', serif')">Times New Roman</button>
                    <button class="font-option" style="font-family: 'Courier New', monospace;" onclick="changeGlobalFont('\'Courier New\', monospace')">Courier New</button>
                    <button class="font-option" style="font-family: Georgia, serif;" onclick="changeGlobalFont('Georgia, serif')">Georgia</button>
                    <button class="font-option" style="font-family: Verdana, sans-serif;" onclick="changeGlobalFont('Verdana, sans-serif')">Verdana</button>
                    <button class="font-option" style="font-family: Impact, charcoal, sans-serif;" onclick="changeGlobalFont('Impact, charcoal, sans-serif')">Impact</button>
                    <button class="font-option" style="font-family: 'Trebuchet MS', sans-serif;" onclick="changeGlobalFont('\'Trebuchet MS\', sans-serif')">Trebuchet MS</button>
                    <button class="font-option" style="font-family: 'Comic Sans MS', cursive;" onclick="changeGlobalFont('\'Comic Sans MS\', cursive')">Comic Sans</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">

        <section>
            <a class="back-link" href="index.html#projects">← Back to Portfolio</a>
            <br>
            <h2>Archived Portfolio Pages</h2>
            <p>Previous iterations of this website, preserved for reference.</p>

            <div class="projects-list-container" style="max-width: 480px; margin: 16px auto 0;">
                <a class="project-row-link" href="secondversion.html">
                    <div class="project-meta-info">
                        <div class="project-vector-icon color-blue">2</div>
                        <div>
                            <h4 class="project-headline-title">2nd Version</h4>
                            <p class="project-sub-label">Old page</p>
                        </div>
                    </div>
                    <span class="project-action-button type-alt">Open</span>
                </a>

                <a class="project-row-link" href="thirdversion.html">
                    <div class="project-meta-info">
                        <div class="project-vector-icon color-dark">3</div>
                        <div>
                            <h4 class="project-headline-title">3rd Version</h4>
                            <p class="project-sub-label">Old page</p>
                        </div>
                    </div>
                    <span class="project-action-button type-alt">Open</span>
                </a>
            </div>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Dave Persaud. All rights reserved.</p>
    </footer>

    <script>
        const modeToggleButton = document.getElementById("themeToggleBtn");
        
        function applyTheme(theme) {
            if (theme === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
                modeToggleButton.textContent = "Light Mode";
            } else {
                document.documentElement.removeAttribute("data-theme");
                modeToggleButton.textContent = "Dark Mode";
            }
        }

        modeToggleButton.addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            applyTheme(newTheme);
            localStorage.setItem("portfolio-theme", newTheme);
        });

        const fontTrigger = document.getElementById("fontDropdownTrigger");
        const fontMenu = document.getElementById("fontDropdownMenu");

        fontTrigger.addEventListener("click", (e) => {
            e.stopPropagation();
            fontMenu.classList.toggle("show-menu");
        });

        function changeGlobalFont(selectedFontFamily) {
            document.documentElement.style.setProperty('--global-font', selectedFontFamily);
            localStorage.setItem("portfolio-font", selectedFontFamily);
            fontMenu.classList.remove("show-menu");
        }

        document.addEventListener("click", () => {
            fontMenu.classList.remove("show-menu");
        });

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("portfolio-theme");
            if (savedTheme) applyTheme(savedTheme);

            const savedFont = localStorage.getItem("portfolio-font");
            if (savedFont) document.documentElement.style.setProperty('--global-font', savedFont);
        });
    </script>

</body>
</html>
